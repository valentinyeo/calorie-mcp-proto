name: Android device proof

# Installs the debug APK on a real Android runtime (the emulator image on a GitHub-hosted
# runner), drives the app over the WebView DevTools protocol, records the screen and keeps
# the video. Never runs on our server.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: install and drive the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - name: Build the APK against the CI worker
        run: |
          cp capacitor.device.config.ts capacitor.config.ts
          VITE_API_BASE=http://10.0.2.2:8788 npm run app:build
          npx cap add android
          npx cap sync android
          (cd android && ./gradlew --no-daemon assembleDebug)
      - name: Install, drive and record the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            npx wrangler d1 migrations apply calorie-mcp-proto --local
            npx wrangler dev --ip 0.0.0.0 --port 8788 \
              --var PUBLIC_URL:http://127.0.0.1:8788 \
              --var SIGNUP_OPEN:1 \
              --var AUTH_SIGNING_SECRET:ci-only-not-a-production-secret > /tmp/worker.log 2>&1 &
            worker=$!
            trap 'kill "$worker" 2>/dev/null || true' EXIT
            node --input-type=module -e 'for(let i=0;i<60;i++){try{if((await fetch("http://127.0.0.1:8788/health")).ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,1000))}process.exit(1)'
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n dev.calorie.tracker/.MainActivity
            sleep 12
            node scripts/drive-device.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-proof
          path: |
            proof/app-device.txt
            proof/device-home*.png
            proof/device-demo.mp4
          if-no-files-found: warn
