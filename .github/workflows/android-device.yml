name: Android device proof

# Installs the debug APK on a real Android runtime (the emulator image on a GitHub-hosted
# runner), drives the app over the WebView DevTools protocol, records the screen and keeps
# the video. Never runs on our server.
# Manual only. The emulator image on the GitHub-hosted runner does not boot in time
# (two dispatches timed out waiting for boot, KVM present). Until it does, the physical
# Android check phone (HYCI-325) is the device proof. Run this by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: install and drive the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check hardware acceleration
        run: ls -l /dev/kvm || true
      - run: npm ci
      - name: Build the APK against the CI worker
        run: |
          cp capacitor.device.config.ts capacitor.config.ts
          VITE_API_BASE=http://10.0.2.2:8788 npm run app:build
          npx cap add android
          npx cap sync android
          (cd android && ./gradlew --no-daemon assembleDebug)
      - name: Install, drive and record the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-proof
          path: |
            proof/app-device.txt
            proof/device-home*.png
            proof/device-demo.mp4
          if-no-files-found: warn
