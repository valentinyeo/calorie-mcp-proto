name: pstack verifier

# Every pull request gets a DeepSeek verifier, for every author (the owner's decision of
# 2026-11-15). The verifier RUNS the app on the base commit and on the head commit, in two local
# checkouts, and compares what a user sees. A diff read, a bot review or green CI is not a verdict.
#
# Never pull_request_target: the head commit's code must never run with a token that can write.
# Drafts are skipped, and a pull request from a fork fails closed because GitHub withholds the
# model login from it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pstack-verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pstack-verifier:
    name: pstack-verifier
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse a pull request from a fork (fail closed)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          {
            echo "pstack-verifier: FAIL @ ${{ github.event.pull_request.head.sha }}"
            echo
            echo "This pull request comes from a fork. GitHub withholds the model login from fork pull requests, so the verifier cannot run, and it fails closed instead of passing."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # gh resolves the repository by running git. The base and head checkouts below live in
      # subdirectories, so the workspace root needs its own checkout or that lookup dies with
      # "not a git repository". Full history puts both commits in this checkout. Verifier
      # scripts still come from the base checkout, or from the head checkout on the first run.
      - name: Check out the repository so both commits exist
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pull request's base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: parent
          persist-credentials: false

      - name: Check out the pull request's head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Take the verifier scripts and feature map from the base commit, or from head on the first run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null
          git rev-parse --verify "$HEAD_SHA^{commit}" >/dev/null
          work="$RUNNER_TEMP/pstack"
          mkdir -p "$work"
          if [ -f parent/verifier/verify.mjs ] && [ -f parent/docs/feature-map.md ]; then
            echo "PSTACK_VERIFIER_DIR=$GITHUB_WORKSPACE/parent/verifier" >> "$GITHUB_ENV"
            echo "PSTACK_FEATURE_MAP=$GITHUB_WORKSPACE/parent/docs/feature-map.md" >> "$GITHUB_ENV"
            echo "PSTACK_VERIFIER_SOURCE=parent" >> "$GITHUB_ENV"
          else
            echo "PSTACK_VERIFIER_DIR=$GITHUB_WORKSPACE/head/verifier" >> "$GITHUB_ENV"
            echo "PSTACK_FEATURE_MAP=$GITHUB_WORKSPACE/head/docs/feature-map.md" >> "$GITHUB_ENV"
            echo "PSTACK_VERIFIER_SOURCE=head" >> "$GITHUB_ENV"
            echo "Bootstrap run: the base commit has no verifier, so the head checkout's own scripts are used this once." >> "$GITHUB_STEP_SUMMARY"
          fi
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > "$work/pr.diff" || true
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$work/pr-body.md"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path' > "$work/changed-files.txt"

      # The app user cannot walk into the runner's own home: the kernel checks every directory
      # on the way down, so a checkout left under $GITHUB_WORKSPACE is unreachable to pstackapp
      # even when pstackapp owns every file in it. That is what the first real run hit: both
      # start scripts died in their first second with "Permission denied", and nothing said so.
      # The checkouts the app runs from are copied to /opt/pstack, which the app user owns; the
      # runner's home keeps its permissions, and the untrusted app never gets a path into it.
      - name: Install, build and start both checkouts as an unprivileged user with no model login
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/pstack"
          app_root=/opt/pstack
          sudo useradd --create-home --shell /bin/bash pstackapp
          sudo install -d -o pstackapp -g pstackapp /opt/pw-browsers /opt/pstack-mounts "$app_root"
          sudo rm -rf "$app_root/parent" "$app_root/head"
          sudo cp -a "$GITHUB_WORKSPACE/parent" "$app_root/parent"
          sudo cp -a "$GITHUB_WORKSPACE/head" "$app_root/head"
          sudo chown -R pstackapp:pstackapp "$app_root/parent" "$app_root/head"
          node_bin=$(dirname "$(command -v node)")
          # env -i plus this short allowlist is the whole environment both checkouts get: no
          # login of any kind, no token, no HOME of a logged-in user. start-app.sh also unsets
          # every model login variable it knows before it starts anything.
          run_as_app() {
            sudo -u pstackapp env -i \
              HOME=/home/pstackapp \
              PATH="$node_bin:/usr/local/bin:/usr/bin:/bin" \
              PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers \
              TMPDIR=/tmp \
              PSTACK_MOUNTS=/opt/pstack-mounts \
              PSTACK_APP_PORT=5173 \
              "$@"
          }
          verifier_side=$PSTACK_VERIFIER_SOURCE
          start_script="$app_root/$verifier_side/verifier/start-app.sh"
          reach="$app_root/$verifier_side/verifier/reach.sh"
          # Before starting anything, name the exact path component that stops the app user, so
          # the log carries one readable line instead of a bare "Permission denied".
          start_side() {
            side=$1
            port=$2
            app="$app_root/$side"
            log="$logs/logs-$side.log"
            : > "$log"
            if ! run_as_app bash "$reach" "$start_script" "$app" >> "$log" 2>&1; then
              echo "FAILED the app user cannot reach $app, so its start script was never started." >> "$log"
              return 0
            fi
            run_as_app bash "$start_script" "$app" "$port" >> "$log" 2>&1 &
            echo $!
          }
          parent_pid=$(start_side parent 8787)
          head_pid=$(start_side head 8789)
          # Ten minutes is the cap, not the plan: the wait ends the moment a starter that has not
          # printed READY or FAILED dies, instead of sleeping out the whole deadline.
          bash "$PSTACK_VERIFIER_DIR/wait-for-start.sh" 600 \
            parent "$logs/logs-parent.log" "$parent_pid" \
            head "$logs/logs-head.log" "$head_pid" || true
          for side in parent head; do
            if grep -q '^READY ' "$logs/logs-$side.log" 2>/dev/null; then
              echo "$side: ready"
            else
              echo "$side: did not start" >> "$GITHUB_STEP_SUMMARY"
              echo "--- $side log ---" >> "$GITHUB_STEP_SUMMARY"
              tail -40 "$logs/logs-$side.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              echo "--- $side log ---"
              tail -40 "$logs/logs-$side.log" 2>/dev/null || true
            fi
          done

      - name: Install the browser the drive tool uses
        run: |
          set -euo pipefail
          cd /opt/pstack/parent
          if [ -x node_modules/.bin/playwright ]; then
            sudo env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers \
              node_modules/.bin/playwright install-deps chromium
            sudo -u pstackapp env -i HOME=/home/pstackapp PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers \
              node_modules/.bin/playwright install chromium
            sudo chmod -R a+rX /opt/pw-browsers
          else
            echo "The base commit declares no playwright, so the drive tool will report that itself." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run the verifier's own offline tests
        run: node --test "$PSTACK_VERIFIER_DIR/test/*.test.mjs"

      - name: Run the pstack verifier (the only step that receives the model login)
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
          PSTACK_AGENT_TIMEOUT_MS: "900000"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # gh names the repository itself, so a call from outside a checkout never guesses one.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The DeepSeek verifier family runs the Pi coding agent and nothing else. Pinned to one
          # exact version from the public registry: `npm view @earendil-works/pi-coding-agent version`.
          npm install -g @earendil-works/pi-coding-agent@1.5.2
          pi --version
          node "$PSTACK_VERIFIER_DIR/verify.mjs" \
            --pr "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --parent "/opt/pstack/parent" \
            --head-dir "/opt/pstack/head" \
            --changed-files "$RUNNER_TEMP/pstack/changed-files.txt" \
            --diff "$RUNNER_TEMP/pstack/pr.diff" \
            --feature-map "$PSTACK_FEATURE_MAP" \
            --pr-body-file "$RUNNER_TEMP/pstack/pr-body.md" \
            --pr-title "$PR_TITLE" \
            --parent-api "http://127.0.0.1:8787" \
            --head-api "http://127.0.0.1:8789" \
            --parent-app "http://localhost:5173/parent/" \
            --head-app "http://localhost:5173/head/" \
            --drive "$PSTACK_VERIFIER_DIR/drive.mjs" \
            --scratch "$RUNNER_TEMP/pstack/scratch" \
            --head-start-log "$RUNNER_TEMP/pstack/logs-head.log" \
            --parent-start-log "$RUNNER_TEMP/pstack/logs-parent.log" \
            --verifier-source "$PSTACK_VERIFIER_SOURCE"

      - name: Keep the verifier's report, screenshots and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pstack-verifier
          path: |
            ${{ runner.temp }}/pstack/scratch
            ${{ runner.temp }}/pstack/logs-parent.log
            ${{ runner.temp }}/pstack/logs-head.log
          if-no-files-found: warn

      - name: Stop the two checkouts
        if: always()
        run: sudo pkill -u pstackapp || true
